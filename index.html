      }

      function sortPlaces(items) {
        return [...items].sort((a, b) => {
          const categoryDifference = categoryOrder.get(a.category) - categoryOrder.get(b.category);
          if (categoryDifference !== 0) {
            return categoryDifference;
          }

          const priorityDifference = a.priority - b.priority;
          if (priorityDifference !== 0) {
            return priorityDifference;
          }

          return a.title.localeCompare(b.title, "ru");
        });
      }

      function groupPlaces(items) {
        const grouped = new Map();

        for (const place of sortPlaces(items)) {
          if (!grouped.has(place.category)) {
            grouped.set(place.category, []);
          }
          grouped.get(place.category).push(place);
        }

        return categories
          .filter((category) => grouped.has(category.id))
          .map((category) => ({
            category,
            places: grouped.get(category.id),
          }));
      }

      function createNode(tagName, className, text) {
        const node = document.createElement(tagName);
        if (className) {
          node.className = className;
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      }

      function scrollToResultsStart() {
        const content = document.getElementById("content");
        const controls = document.getElementById("controls");

        if (!content || typeof window.scrollTo !== "function") {
          return;
        }

        const currentScroll = window.scrollY || window.pageYOffset || 0;
        const contentTop = content.getBoundingClientRect().top;
        const controlsHeight = controls?.getBoundingClientRect().height || 0;
        const breathingRoom = 16;

        window.scrollTo({
          top: Math.max(0, currentScroll + contentTop - controlsHeight - breathingRoom),
          behavior: "smooth",
        });
      }

      function renderCategoryChips() {
        const container = document.getElementById("categoryFilters");
        container.innerHTML = "";

        const filters = [{ id: "all", chipLabel: "Все" }, ...categories];
        for (const filter of filters) {
          const button = createNode("button", "chip", filter.chipLabel);
          button.type = "button";
          button.dataset.category = filter.id;
          button.setAttribute("aria-pressed", String(state.category === filter.id));
          button.addEventListener("click", () => {
            state.category = filter.id;
            renderCategoryChips();
            renderGuide();
            scrollToResultsStart();
          });
          container.appendChild(button);
        }
      }

      function renderTags(place, card) {
        if (!place.tags || place.tags.length === 0) {
          return;
        }

        const tagList = createNode("ul", "tags");
        tagList.setAttribute("aria-label", `Теги: ${place.title}`);
        for (const tag of place.tags) {
          tagList.appendChild(createNode("li", "tag", tag));
        }
        card.appendChild(tagList);
      }

      function renderMapLink(place, card) {
        if (!place.mapUrl) {
          return;
        }

        const link = createNode("a", "map-link", "Карта");
        link.href = place.mapUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", `Открыть на карте: ${place.title}`);
        card.appendChild(link);
      }

      function renderPlaceCard(place) {
        const card = createNode("article", "place-card");
        const media = createNode("div", "place-card__media");
        const image = createNode("img", "place-card__photo-image");
        image.src = place.image.src;
        image.alt = place.image.alt;
        image.loading = "lazy";
        image.decoding = "async";
        media.appendChild(image);

        const body = createNode("div", "place-card__body");
        const top = createNode("div", "place-card__top");
        top.append(
          createNode("span", "badge", place.categoryLabel),
          createNode("span", "place-number", String(place.priority).padStart(2, "0")),
        );

        const title = createNode("h3", "", place.title);
        const description = createNode("p", "place-card__description", place.description);

        body.append(top, title, description);
        renderTags(place, body);
        renderMapLink(place, body);
        card.append(media, body);

        return card;
      }

      function renderCategorySection(group) {
        const section = createNode("section", "category-section");
        section.id = group.category.id;

        const heading = createNode("div", "section-heading");
        heading.append(
          createNode("h2", "", group.category.label),
          createNode("span", "section-count", `${group.places.length} ${getPlaceWord(group.places.length)}`),
        );

        const grid = createNode("div", "places-grid");
        for (const place of group.places) {
          grid.appendChild(renderPlaceCard(place));
        }

        section.append(heading, grid);
        return section;
      }

      function getPlaceWord(count) {
        const lastDigit = count % 10;
        const lastTwoDigits = count % 100;

        if (lastDigit === 1 && lastTwoDigits !== 11) {
          return "место";
        }
        if (lastDigit >= 2 && lastDigit <= 4 && (lastTwoDigits < 12 || lastTwoDigits > 14)) {
          return "места";
        }
        return "мест";
      }

      function renderEmptyState(container) {
        const empty = createNode("div", "empty-state");
        empty.append(
          createNode("strong", "", "Ничего не найдено"),
          createNode("span", "", "Попробуйте изменить запрос или выбрать другую категорию."),
        );
        container.appendChild(empty);
      }

      function renderGuide() {
        const container = document.getElementById("guideSections");
        const filteredPlaces = filterPlaces(state);
        const groups = groupPlaces(filteredPlaces);
        container.innerHTML = "";

        if (groups.length === 0) {
          renderEmptyState(container);
          return;
        }

        for (const group of groups) {
          container.appendChild(renderCategorySection(group));
        }
      }

      function buildJsonLd() {
        return {
          "@context": "https://schema.org",
          "@type": "CollectionPage",
          name: "Гид по Геленджику",
          description:
            "Личная подборка мест: природа, рестораны, кофейни, пляжи, детские места, спорт и полезные точки.",
          inLanguage: "ru",
          mainEntity: {
            "@type": "ItemList",
            numberOfItems: places.length,
            itemListElement: sortPlaces(places).map((place, index) => ({
              "@type": "ListItem",
              position: index + 1,
              item: {
                "@type": "Place",
                name: place.title,
                description: place.description,
                category: place.categoryLabel,
                ...(place.mapUrl ? { url: place.mapUrl } : {}),
              },
            })),
          },
        };
      }

      function updateJsonLd() {
        const jsonLd = document.getElementById("jsonLd");
        if (jsonLd) {
          jsonLd.textContent = JSON.stringify(buildJsonLd(), null, 2);
        }
      }

      function initGuide() {
        renderCategoryChips();
        renderGuide();
        updateJsonLd();

        const searchInput = document.getElementById("placeSearch");
        searchInput.addEventListener("input", (event) => {
          state.query = event.target.value;
          renderGuide();
        });
      }

      window.GelendzhikGuide = {
        categories,
        places,
        filterPlaces,
        groupPlaces,
        sortPlaces,
      };

      document.addEventListener("DOMContentLoaded", initGuide);
    </script>
  </body>
</html>
